name: Release plugin and publish Jellyfin catalog
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (vX.Y.Z) to release'
        required: true
permissions:
  contents: read
concurrency:
  group: private-syncplay-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require the current official latest stable release
        id: server
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/jellyfin-versions.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:ui
      - run: node --test tests/jellyfin-versions.test.mjs
      - run: dotnet test tests/Jellyfin.Plugin.PrivateSyncPlay.Tests -c Release
      - run: dotnet build examples/WatchPartyConsumer -c Release
      - shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use an existing vX.Y.Z tag' }
          ./scripts/package.ps1 -Version $env:RELEASE_TAG.Substring(1) -Repository $env:GITHUB_REPOSITORY -Changelog "Private SyncPlay $env:RELEASE_TAG for Jellyfin ${{ steps.server.outputs.latest }}. Release notes: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
      - run: node scripts/validate-package.mjs
      - shell: pwsh
        run: ./tests/catalog-publish.test.ps1
      - shell: pwsh
        run: ./tests/catalog-history.test.ps1
      - run: node scripts/integration.mjs "${{ runner.temp }}/private-syncplay-release-test" --with-consumer --install-from-catalog --image=${{ steps.server.outputs.image }}
      - shell: pwsh
        run: ./scripts/test-upgrade.ps1 -Directory "${{ runner.temp }}/private-syncplay-upgrade" -Image 'jellyfin/jellyfin:${{ steps.server.outputs.latest }}'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            artifacts/*.zip
            artifacts/manifest.json
  publish:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: artifacts
      - name: Merge catalog history without rebuilding verified release assets
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use an existing vX.Y.Z tag' }
          $previous = Join-Path $env:RUNNER_TEMP 'previous-catalog'
          New-Item -ItemType Directory -Force $previous | Out-Null
          $refsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/heads/catalog"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read catalog history; refusing to lose previous entries' }
          $refs = @($refsJson | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object { $_.ref -eq 'refs/heads/catalog' })
          if ($refs.Count -gt 0) {
            $parent = $refs[0].object.sha
            "CATALOG_PARENT=$parent" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            $oldJson = gh api "repos/$env:GITHUB_REPOSITORY/contents/manifest.json?ref=$parent"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read previous catalog' }
            $old = $oldJson | ConvertFrom-Json
            [IO.File]::WriteAllBytes((Join-Path $previous 'manifest.json'), [Convert]::FromBase64String($old.content))
          } else {
            # Preserve history when upgrading from the former release-asset-only repository.
            $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read legacy release catalog history' }
            $legacy = @($releasesJson | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object {
              -not $_.draft -and -not $_.prerelease -and @($_.assets | Where-Object { $_.name -eq 'manifest.json' }).Count -gt 0
            } | Select-Object -First 1)
            if ($legacy.Count -gt 0) {
              gh release download $legacy[0].tag_name --repo $env:GITHUB_REPOSITORY --pattern manifest.json --dir $previous
              if ($LASTEXITCODE -ne 0) { throw 'Cannot download legacy catalog history' }
            }
          }
          $manifest = Join-Path $previous 'manifest.json'
          if (Test-Path $manifest) { ./scripts/merge-catalog.ps1 -Manifest artifacts/manifest.json -PreviousManifest $manifest }
      - run: node scripts/validate-package.mjs
      - name: Recheck latest server before publishing
        run: node scripts/jellyfin-versions.mjs
      - name: Publish immutable version release assets
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          gh release create $env:RELEASE_TAG "artifacts/PrivateSyncPlay-$version.zip" artifacts/PrivateSyncPlay.Api-1.0.0.zip artifacts/manifest.json --verify-tag --title "Private SyncPlay $version" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release was not published; existing assets are never overwritten' }
      - name: Publish stable raw Jellyfin catalog after release assets exist
        shell: pwsh
        run: ./scripts/publish-catalog.ps1 -Repository $env:GITHUB_REPOSITORY -ParentCommit "$env:CATALOG_PARENT"
