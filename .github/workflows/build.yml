name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:ui
      - run: dotnet test tests/Jellyfin.Plugin.PrivateSyncPlay.Tests -c Release
      - shell: pwsh
        run: ./scripts/package.ps1
      - run: node scripts/validate-package.mjs
      - shell: pwsh
        run: ./tests/catalog-publish.test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateSyncPlay-preview
          path: |
            artifacts/*.zip
            artifacts/manifest.json
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: dotnet build src/Jellyfin.Plugin.PrivateSyncPlay -c Release
      - run: dotnet build examples/WatchPartyConsumer -c Release
      - shell: pwsh
        run: ./scripts/package.ps1
      - run: node scripts/validate-package.mjs
      - run: node scripts/integration.mjs "${{ runner.temp }}/private-syncplay-integration" --with-consumer --install-from-catalog
