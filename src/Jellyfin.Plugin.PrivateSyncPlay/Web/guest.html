<!doctype html>
<html lang="en" dir="ltr" data-theme="{{THEME}}" class="layout-desktop">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Watch party</title>
<link id="privateSyncPlayNativeCss" rel="stylesheet" href="assets/native.css">
<!--JELLYFIN_THEME-->
<link id="privateSyncPlayCss" rel="stylesheet" href="assets/ui.css">
<link rel="stylesheet" href="../Branding/Css">
<script defer src="assets/ui.js"></script><script defer src="assets/hls.js"></script><script defer src="assets/guest.js"></script>
</head>
<body dir="ltr" class="skinBody privateSyncPlayGuest">
<main class="privateSyncPlayContent content-primary">
<h1 class="sectionTitle">Watch party</h1>
<p id="status" class="fieldDescription" role="status" aria-live="polite">You have been invited to watch a party.</p>
<div id="actions" class="privateSyncPlayActions">
<button is="emby-button" id="join" type="button" class="emby-button raised button-submit"><span>Watch as guest</span></button>
<a is="emby-linkbutton" id="signin" class="emby-button raised"><span>Join with Jellyfin account</span></a>
</div>
<video id="video" class="privateSyncPlayVideo" playsinline disablepictureinpicture controlslist="nodownload noremoteplayback"></video>
<div class="privateSyncPlayActions">
<button is="emby-button" id="play" type="button" class="emby-button raised button-submit" hidden><span>Enable playback</span></button>
<button is="emby-button" id="leave" type="button" class="emby-button raised" hidden><span>Leave party</span></button>
</div>
<div class="sliderContainer-settings"><label class="sliderLabel" for="volume">Volume</label>
<div class="mdl-slider-container"><input is="emby-slider" data-embyslider="true" id="volume" class="mdl-slider mdl-js-slider mdl-slider-hoverthumb" type="range" min="0" max="1" step="0.05" value="1">
<div class="mdl-slider-background-flex-container" aria-hidden="true"><div class="mdl-slider-background-flex"><div class="mdl-slider-background-flex-inner">
<div class="mdl-slider-background-upper"></div><div id="volumeProgress" class="mdl-slider-background-lower"></div>
</div></div></div></div></div>
<p class="fieldDescription">You can watch this party only. Playback is controlled by its signed-in members. Guest access ends with the party.</p>
</main></body></html>
