<!doctype html><html><head><title>Private SyncPlay</title></head><body>
<div id="privateSyncPlaySettings" data-role="page" class="page type-interior pluginConfigurationPage privateSyncPlaySettings">
<div data-role="content"><div class="content-primary"><div class="readOnlyContent">
<h2 class="sectionTitle">Private SyncPlay</h2>
<p id="pspVersion" class="fieldDescription" role="status">Loading version…</p>
<p class="fieldDescription">Limits apply server-side. Guests receive no Jellyfin account or general API access. HTTPS is required for guest viewing.</p>
<form id="pspForm"><p class="fieldDescription" role="status">Loading settings…</p></form>
</div></div></div>
<script type="text/javascript">
(function () {
    'use strict';
    var id = '09514a9e-f7a0-4c5a-91bc-3a46338298ca';
    var page = document.querySelector('#privateSyncPlaySettings'), form = page.querySelector('#pspForm');
    var config, rows = [], feedback, UI, loading;
    var bools = { EnablePrivateGroups:'Enable private groups', AllowPublicGroups:'Allow public groups',
        EnableGuestInvites:'Enable guest invitations (server-wide master switch)', DefaultGuestPermission:'Permit guest invitations by default for users' };
    var numbers = { MaxGuestStreams:['Maximum concurrent guest streams (server-wide)',1,32], MaxViewers:['Maximum simultaneous viewers',1,1000], MaxInviteUses:['Maximum uses per invitation',1,10000],
        GuestLeaseSeconds:['Guest reconnect grace (seconds)',10,120], GuestVideoBitrateKbps:['Guest video bitrate cap (kbps)',256,10000] };
    function enumValue(value, choices) { return typeof value === 'number' ? choices[value] : value; }
    function loadUI() {
        return window.privateSyncPlayUILoading ||= new Promise(function (resolve, reject) {
            if (window.PrivateSyncPlayUI) { resolve(window.PrivateSyncPlayUI); return; }
            var script = document.createElement('script'); script.src = ApiClient.getUrl('PrivateSyncPlay/assets/ui.js');
            script.onload = function () { resolve(window.PrivateSyncPlayUI); }; script.onerror = reject; document.head.appendChild(script);
        });
    }
    async function load() {
        UI = await loadUI();
        config = await ApiClient.getPluginConfiguration(id);
        try {
            var version = await ApiClient.ajax({ type:'GET', url:ApiClient.getUrl('PrivateSyncPlay/Version'), dataType:'json' });
            page.querySelector('#pspVersion').textContent = 'Private SyncPlay ' + (version.PluginVersion || version.pluginVersion)
                + ' · Jellyfin ' + (version.ServerVersion || version.serverVersion)
                + '. Version history and updates: Dashboard → Plugins → Catalog → Private SyncPlay. Restart Jellyfin after installing an update.';
        } catch {
            page.querySelector('#pspVersion').textContent = 'Version information unavailable. Check Dashboard → Plugins for installed versions and updates.';
        }
        var users = await ApiClient.getUsers(); form.replaceChildren(); rows = [];
        Object.keys(bools).forEach(function (key) { UI.field(bools[key], 'checkbox', config[key], form, key); });
        UI.select('Default creation mode', ['Public','Private'], enumValue(config.DefaultMode,['Public','Private']), form, 'DefaultMode');
        Object.keys(numbers).forEach(function (key) {
            var spec = numbers[key], input = UI.field(spec[0], 'number', config[key], form, key);
            input.min = spec[1]; input.max = spec[2]; input.required = true;
        });
        UI.element('p', 'Compatible streams are copied. Required conversion follows Jellyfin’s Playback → Transcoding settings, including hardware acceleration.', form, 'fieldDescription');
        UI.element('h3', 'Per-user permissions', form, 'sectionTitle');
        UI.element('p', 'Inherit uses server settings. Allow never overrides a disabled server-wide capability.', form, 'fieldDescription');
        users.forEach(function (user) {
            var settings = (config.Users || []).find(function (u) { return u.UserId.replace(/-/g,'') === user.Id.replace(/-/g,''); }) || {};
            var section = UI.element('section', null, form, 'verticalSection privateSyncPlayUser');
            UI.element('h3', user.Name, section, 'sectionTitle');
            function permission(key, label) { return UI.select(label, ['Inherit','Allow','Deny'], enumValue(settings[key], ['Inherit','Allow','Deny']) || 'Inherit', section); }
            rows.push({ id:user.Id,
                mode:UI.select('Default creation mode', ['Inherit','Public','Private'], settings.DefaultMode == null ? 'Inherit' : enumValue(settings.DefaultMode,['Public','Private']), section),
                public:permission('CreatePublic','Create public groups'), private:permission('CreatePrivate','Create private groups'), guest:permission('GuestInvites','Create guest invitations') });
        });
        feedback = UI.status(form, 'pspResult');
        var save = UI.button('Save', form, null, 'primary'); save.type = 'submit';
    }
    function refresh() {
        if (!loading) loading = load().catch(function () {
            var target = feedback || form.querySelector('[role=status]');
            if (target) target.textContent = 'Could not load settings.';
        }).finally(function () { loading = null; });
    }
    page.addEventListener('viewshow', refresh);
    form.addEventListener('submit', async function (event) {
        event.preventDefault(); if (!config || !UI || !form.reportValidity()) return;
        var save = form.querySelector('[type=submit]'); save.disabled = true;
        Object.keys(bools).forEach(function (key) { config[key] = page.querySelector('#'+key).checked; });
        Object.keys(numbers).forEach(function (key) { config[key] = Number(page.querySelector('#'+key).value); });
        config.DefaultMode = page.querySelector('#DefaultMode').value;
        config.Users = rows.map(function (r) { return { UserId:r.id, DefaultMode:r.mode.value === 'Inherit' ? null : r.mode.value, CreatePublic:r.public.value, CreatePrivate:r.private.value, GuestInvites:r.guest.value }; });
        try { await ApiClient.updatePluginConfiguration(id, config); UI.message(feedback, 'Saved. Guest permission changes revoke affected sessions.'); }
        catch (error) { UI.message(feedback, 'Save failed. Check limits and whether default modes are allowed.', true); }
        finally { save.disabled = false; }
    });
    refresh();
})();
</script></div></body></html>
